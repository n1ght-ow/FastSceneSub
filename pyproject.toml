[project]
name = "fastscenesub"
version = "0.1.0"
description = "Windows realtime scene subtitles via OpenRouter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyside6>=6.8",
  "pyaudiowpatch>=0.2.12.7",
  "numpy>=1.26",
  "soxr>=0.5",
  "onnxruntime>=1.20",
  "soundfile>=0.12",
  "httpx[http2,socks]>=0.27",
]

[tool.uv]
package = false